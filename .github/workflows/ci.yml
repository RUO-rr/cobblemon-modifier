name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 校验 Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建并运行测试
        run: ./gradlew build --no-daemon

      - name: 归档构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cobblemon-modifier-jar
          path: build/libs/*.jar
